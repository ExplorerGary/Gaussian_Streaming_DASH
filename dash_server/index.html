<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DASH Server</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		body {
			display: flex;
			flex-direction: column;
		}
		main {
			/* take remaining viewport height under the navbar */
			flex: 1 1 auto;
			display: flex;
			align-items: stretch;
			padding-top: 1rem;
			padding-bottom: 1rem;
		}
		.container > .p-5 {
			/* make the inner panel fill available space */
			flex: 1 1 auto;
			display: flex;
			align-items: stretch;
		}
		.container-fluid.py-5.text-center {
			/* ensure video container stretches */
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
		}
		video {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="#">DASH</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample" aria-controls="navbarsExample" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarsExample">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="#">About</a></li>
					<li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container py-5">
		<div class="p-5 mb-4 bg-light rounded-3">
			<div class="container-fluid py-5 text-center">
                <video id="videoPlayer" muted controls></video>

				<!-- <h1 class="display-5 fw-bold">Welcome to DASH</h1>
				<p class="col-md-8 mx-auto fs-5">Bootstrap boilerplate ready for your project.</p>
				<button class="btn btn-primary btn-lg" type="button">Get Started</button> -->
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.dashjs.org/v5.0.0/modern/umd/dash.all.min.js"></script>

    <!-- we have to load the custom ABR rule here! -->
	<script src="../ABR_Rules/LowestBitrateRule.js"></script>


    <!-- Initialize the DASH player -->

    <script>
    (function () {
        var url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";
        var local_url = "..\\MPD_lib\\Dummy_Video\\manifest.mpd";
        var player = dashjs.MediaPlayer().create();
        
    
        // prepare to inject the custom abr rule here:

        // step one: disable all built-in rules
        player.updateSettings({
            abr: {
                rules: {
                    throughputRule: {
                        active: false
                    },
                    bolaRule: {
                        active: false
                    },
                    insufficientBufferRule: {
                        active: false
                    },
                    switchHistoryRule: {
                        active: false
                    },
                    droppedFramesRule: {
                        active: false
                    },
                    abandonRequestsRule: {
                        active: false
                    }
                }
                
            }
        });
    
        // step two: add your own custom rule here, e.g. a simple rule that always selects the lowest bitrate
        // for now, we use the official LowestBitrateRule as an example, but you can replace it with your own custom logic
        
        // first, we have to load it from official CDN
        player.addABRCustomRule('qualitySwitchRules', 'LowestBitrateRule', LowestBitrateRule);
    
        // playing is the final step, so we do it at the end after all setup is done
        player.initialize(document.querySelector("#videoPlayer"), local_url, true);
    })();
    </script>

</body>
</html>
