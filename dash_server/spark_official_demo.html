<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Local PLY</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }

    canvas {
      display: block;
    }

    #hint {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 1;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 14px/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Loading local PLY...</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // renderer.toneMapping = THREE.ACESFilmicToneMapping;
    // renderer.toneMappingExposure = 1.2;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0.4, 2.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enablePan = false;
    controls.minDistance = 0.5;
    controls.maxDistance = 8;
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI;
    controls.update();

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const localPlyURL = "../MPD_lib/LongDress_Gaussian/model/8i/longdress/dynamic-lapis/longdress_res1/1051/point_cloud/iteration_30000/point_cloud.ply";
    const localSplat = new SplatMesh({ url: localPlyURL });
    localSplat.quaternion.set(1, 0, 0, -1);
    localSplat.position.set(0, 0, 0);
    localSplat.scale.setScalar(1);
    scene.add(localSplat);

    localSplat.initialized.then(() => {
      const hint = document.getElementById('hint');
      if (hint) hint.textContent = 'Local PLY loaded.';
    });

    renderer.setAnimationLoop(function animate(time) {
      controls.update();
    //   localSplat.rotation.y = time * 0.00015;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
